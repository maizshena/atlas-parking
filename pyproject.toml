[project]
name = "atlas-parking"
version = "0.1.0"
description = "Aplikasi Parkir UKK RPL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "argon2-cffi",
    "cryptography",
    "fastapi",
    "itsdangerous",
    "jinja2",
    "pydantic",
    "pydantic-settings",
    "pymysql",
    "python-dotenv",
    "python-multipart",
    "sqlalchemy",
    "uvicorn[standard]",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pdoc>=16.0.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
